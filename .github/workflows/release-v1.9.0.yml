name: Release v1.9.0

on:
  push:
    paths:
      - '.github/workflows/release-v1.9.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build v1.9.0
        working-directory: plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare release JAR
        run: cp plugin/target/universal-smp-backup-1.9.0.jar Just-Backup-v1.9.0.jar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.0 >/dev/null 2>&1; then
            gh release upload v1.9.0 Just-Backup-v1.9.0.jar --clobber
          else
            gh release create v1.9.0 Just-Backup-v1.9.0.jar \
              --target "$GITHUB_SHA" \
              --title "Just-Backup v1.9.0" \
              --notes "Just-Backup v1.9.0

Player-data-only cloud backups for Paper 1.21.11.

Highlights:
- /backup save <player> or /backup save all
- /backup load <player> or /backup load all
- Advancement progress restores without advancement chat spam
- Render-hosted API connected to Neon
- Maximum 2 backups per player
- 100 MiB player-backup cap per server
- 950 MiB global player-backup cap
- No world or chunk backups"
          fi
