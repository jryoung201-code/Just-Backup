Backup:
  Save-When:
    - PLAYER_QUIT
    - SERVER_SHUTDOWN
    - EVERY_30_MINUTES

  Load-When:
    - LOCAL_DATA_MISSING
    - PLAYER_JOIN
    - SERVER_RESTART

  Player-Data:
    Gamemode: true
    Location: true
    World: true
    Inventory: true
    Armor: true
    Offhand: true
    EnderChest: true
    Health: true
    Hunger: true
    Saturation: true
    Experience: true
    Potion-Effects: true
    Spawnpoint: true
    Advancements: true
    Statistics: true
    Recipes: true

  Plugin-Data:
    Enabled: false
    Custom-Folders: []
