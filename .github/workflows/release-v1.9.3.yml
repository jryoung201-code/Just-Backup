name: Release v1.9.3

on:
  push:
    paths:
      - '.github/workflows/release-v1.9.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build v1.9.3
        working-directory: plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare release JAR
        run: cp plugin/target/universal-smp-backup-1.9.3.jar Just-Backup-v1.9.3.jar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.3 >/dev/null 2>&1; then
            gh release upload v1.9.3 Just-Backup-v1.9.3.jar --clobber
          else
            gh release create v1.9.3 Just-Backup-v1.9.3.jar --target "$GITHUB_SHA" --title "Just-Backup v1.9.3" --notes "Just-Backup v1.9.3

Includes:
- Reliable save on player quit/server shutdown
- HasOp backup and restore
- /backup save <player|all>
- /backup load <player|all>
- Trusted UUID access for save/load
- No automatic load on normal player join by default
- Advancement restores without chat spam
- Player-data-only cloud backups"
          fi
